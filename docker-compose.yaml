services:
  db:
    build:
      context: ./db/
      dockerfile: Dockerfile
    container_name: mysql-db
    image: mrmotam/expense-db:0.1.0
    command: --mysql-native-password=ON --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: 'ExpenseApp@1'
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    build: ./backend
    container_name: backend
    image: mrmotam/expense-backend:0.1.0
    environment:
      DB_HOST: mysql-db
    depends_on:
     - db
  frontend:
    build: ./frontend
    container_name: frontend
    image: mrmotam/expense-frontend:0.1.0
    ports:
    - "80:80"
    depends_on:
      - backend