services:
  db:
    build:
      context: ./db/
      dockerfile: Dockerfile
    container_name: mysql-db
    image: mrmotam/expense-db:0.1.0
    command: --mysql-native-password=ON --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: '<<YOUR PASSWORD>>'
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
  backend:
    build: ./backend
    container_name: backend
    image: mrmotam/expense-backend:0.1.0
    environment:
      DB_HOST: mysql-db
    volumes:
      - backend:/app
    depends_on:
     - db
  frontend:
    build: ./frontend
    container_name: frontend
    image: mrmotam/expense-frontend:0.1.0
    ports:
    - "80:80"
    volumes:
      - frontend:/usr/share/nginx/html
    depends_on:
      - backend
networks:
  default:
    name: expense
    driver: bridge
    external: false
volumes:
  backend:
  mysql-data:
  frontend: