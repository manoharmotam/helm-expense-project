apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    labels:
        project: expense-app
        tier: backend
        component: backend
spec:
    replicas: 2
    selector:
        matchLabels:
            project: expense-app
            tier: backend
            component: backend
    template:
        metadata:
            labels:
                project: expense-app
                tier: backend
                component: backend
        spec:
            containers:
            - name: backend
              image: mrmotam/expense-backend:0.1.0
              env:
              - name: DB_HOST
                value: mysql
              - name: DB_USER
                value: expense
                  
    